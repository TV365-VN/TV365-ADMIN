<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TV365 ADMIN</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #f5f6fa;
    color: #222;
}

.header {
    background: #111827;
    color: white;
    padding: 18px 25px;
    font-size: 22px;
    font-weight: bold;
}

.container {
    max-width: 1000px;
    margin: 30px auto;
    padding: 20px;
}

.card {
    background: white;
    border-radius: 12px;
    padding: 25px;
    box-shadow: 0 3px 15px rgba(0,0,0,.08);
    margin-bottom: 20px;
}

h2 {
    margin-top: 0;
}

label {
    display: block;
    margin-top: 18px;
    margin-bottom: 7px;
    font-weight: bold;
}

input {
    width: 100%;
    padding: 13px;
    border: 1px solid #ccc;
    border-radius: 8px;
    font-size: 16px;
}

button {
    padding: 12px 18px;
    border: none;
    border-radius: 8px;
    background: #2563eb;
    color: white;
    font-weight: bold;
    cursor: pointer;
    font-size: 15px;
}

button:hover {
    opacity: .9;
}

button:disabled {
    opacity: .5;
    cursor: not-allowed;
}

.login-btn {
    width: 100%;
    margin-top: 20px;
}

.logout {
    background: #dc2626;
    float: right;
}

.buttons {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 10px;
    margin-top: 20px;
}

.buttons button {
    background: #2563eb;
}

.buttons button.selected {
    background: #16a34a !important;
    box-shadow: 0 0 0 3px rgba(22,163,74,.20);
    transform: translateY(-1px);
}

.activate-panel {
    margin-top: 18px;
    padding: 16px;
    background: #f8fafc;
    border: 1px solid #e2e8f0;
    border-radius: 10px;
}

.selected-duration {
    margin-bottom: 12px;
    font-size: 16px;
    color: #334155;
}

.activate-main {
    width: 100%;
    background: #16a34a;
    font-size: 16px;
    padding: 14px;
}

.activate-main:disabled {
    background: #94a3b8;
}

.status {
    margin-top: 20px;
    padding: 15px;
    background: #f1f5f9;
    border-radius: 8px;
    line-height: 1.6;
}

.success {
    background: #dcfce7;
    color: #166534;
}

.error {
    background: #fee2e2;
    color: #991b1b;
}

.info {
    background: #dbeafe;
    color: #1e40af;
}

.hidden {
    display: none;
}

.user-info {
    margin-bottom: 20px;
    padding: 12px;
    background: #f1f5f9;
    border-radius: 8px;
}

.device-info {
    margin-top: 20px;
    padding: 15px;
    background: #f8fafc;
    border-radius: 8px;
    border: 1px solid #e2e8f0;
}

@media(max-width:700px) {
    .buttons {
        grid-template-columns: repeat(2, 1fr);
    }

    .container {
        padding: 10px;
        margin-top: 15px;
    }

    .logout {
        float: none;
        width: 100%;
        margin-top: 15px;
    }
}

.custom-duration {
    margin-top: 22px;
    padding: 18px;
    background: #f8fafc;
    border: 1px solid #e2e8f0;
    border-radius: 10px;
}

.custom-row {
    display: grid;
    grid-template-columns: 1fr 180px;
    gap: 10px;
}

.custom-row select {
    width: 100%;
    padding: 13px;
    border: 1px solid #ccc;
    border-radius: 8px;
    font-size: 16px;
    background: white;
}

.custom-button {
    width: 100%;
    margin-top: 12px;
    background: #16a34a;
}

@media(max-width:700px) {
    .custom-row {
        grid-template-columns: 1fr;
    }
}

</style>
</head>

<body>

<div class="header">
    📺 TV365 ADMIN
</div>


<div class="container">

    <!-- =====================================================
         ĐĂNG NHẬP
    ====================================================== -->

    <div class="card" id="loginCard">

        <h2>🔐 Đăng nhập Admin</h2>

        <p>
            Chỉ tài khoản quản trị TV365 mới được sử dụng hệ thống.
        </p>

        <label>Email</label>

        <input
            type="email"
            id="email"
            placeholder="Email Admin"
        >

        <label>Mật khẩu</label>

        <input
            type="password"
            id="password"
            placeholder="Mật khẩu"
        >

        <button
            class="login-btn"
            onclick="login()"
            id="loginButton"
        >
            ĐĂNG NHẬP
        </button>

        <div
            class="status"
            id="loginStatus"
        >
            Vui lòng đăng nhập.
        </div>

    </div>


    <!-- =====================================================
         ADMIN PANEL
    ====================================================== -->

    <div class="card hidden" id="adminCard">

        <button
            class="logout"
            onclick="logout()"
        >
            ĐĂNG XUẤT
        </button>

        <h2>⚙️ Quản lý Premium</h2>

        <div class="user-info">
            👤 Admin:
            <strong id="adminEmail"></strong>
        </div>


        <label>ID thiết bị</label>

        <input
            type="text"
            id="deviceId"
            placeholder="Ví dụ: TV365-DT-5014A6"
            autocomplete="off"
        >


        <button
            style="margin-top:15px; width:100%;"
            onclick="checkDevice()"
        >
            🔍 KIỂM TRA ID
        </button>


        <div
            class="device-info hidden"
            id="deviceInfo"
        ></div>


        <label>Thời hạn Premium</label>

        <div class="buttons">

            <button type="button" data-duration="1" onclick="selectDuration(1, 'days', '1 NGÀY', this)">
                1 NGÀY
            </button>

            <button type="button" data-duration="7" onclick="selectDuration(7, 'days', '7 NGÀY', this)">
                7 NGÀY
            </button>

            <button type="button" data-duration="1m" onclick="selectDuration(1, 'months', '1 THÁNG', this)">
                1 THÁNG
            </button>

            <button type="button" data-duration="3m" onclick="selectDuration(3, 'months', '3 THÁNG', this)">
                3 THÁNG
            </button>

            <button type="button" data-duration="6m" onclick="selectDuration(6, 'months', '6 THÁNG', this)">
                6 THÁNG
            </button>

            <button type="button" data-duration="1y" onclick="selectDuration(1, 'years', '1 NĂM', this)">
                1 NĂM
            </button>

            <button type="button" data-duration="forever" onclick="selectDuration(0, 'forever', 'VĨNH VIỄN', this)" style="background:#16a34a;">
                ♾️ VĨNH VIỄN
            </button>

        </div>

        <div class="custom-duration">
            <label>Thời hạn tùy chỉnh</label>

            <div class="custom-row">
                <input type="number" id="customValue" min="1" step="1" placeholder="Nhập số">
                <select id="customUnit">
                    <option value="days">NGÀY</option>
                    <option value="months">THÁNG</option>
                    <option value="years">NĂM</option>
                </select>
            </div>

            <button type="button" class="custom-button" onclick="selectCustomDuration()">
                ➕ CHỌN THỜI HẠN TÙY CHỈNH
            </button>
        </div>

        <div class="activate-panel">
            <div class="selected-duration">
                Thời hạn đã chọn: <strong id="selectedDurationText">Chưa chọn</strong>
            </div>

            <button type="button" id="activateButton" class="activate-main" onclick="activateSelected()" disabled>
                🔐 KÍCH HOẠT PREMIUM
            </button>
        </div>

        <div
            class="status"
            id="status"
        >
            Chưa có thao tác.
        </div>

    </div>

</div>


<!-- =========================================================
     FIREBASE
========================================================= -->

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>


<script>

/* =========================================================
   FIREBASE CONFIG
   TV365
========================================================= */

const firebaseConfig = {

    apiKey: "AIzaSyAH--nzfxtxwRiPW8RwikcTmdM82pFpGSw",

    authDomain: "tv365-b45e0.firebaseapp.com",

    projectId: "tv365-b45e0",

    storageBucket: "tv365-b45e0.firebasestorage.app",

    messagingSenderId: "157742231327",

    appId: "1:157742231327:web:4e00ccddb6fcde93d94a2a"

};


/* Khởi tạo Firebase */

firebase.initializeApp(firebaseConfig);

const auth = firebase.auth();

const db = firebase.firestore();


/* =========================================================
   ĐĂNG NHẬP
========================================================= */

function login() {

    const email =
        document.getElementById("email").value.trim();

    const password =
        document.getElementById("password").value;


    if (!email || !password) {

        showLoginStatus(
            "Vui lòng nhập email và mật khẩu.",
            "error"
        );

        return;
    }


    const button =
        document.getElementById("loginButton");

    button.disabled = true;

    button.innerText = "ĐANG ĐĂNG NHẬP...";


    auth.signInWithEmailAndPassword(
        email,
        password
    )

    .then((result) => {

        const user = result.user;

        /*
         * Chỉ cho đúng Admin của TV365
         */

        if (
            user.email.toLowerCase()
            !== "xavantai@gmail.com"
        ) {

            return auth.signOut().then(() => {

                throw new Error(
                    "Tài khoản này không có quyền Admin."
                );

            });

        }

        showAdminPanel(user);

    })

    .catch((error) => {

        console.error(error);

        showLoginStatus(
            "Đăng nhập thất bại: " +
            getFirebaseError(error),
            "error"
        );

    })

    .finally(() => {

        button.disabled = false;

        button.innerText = "ĐĂNG NHẬP";

    });
}


/* =========================================================
   HIỂN THỊ ADMIN
========================================================= */

function showAdminPanel(user) {

    document
        .getElementById("loginCard")
        .classList.add("hidden");


    document
        .getElementById("adminCard")
        .classList.remove("hidden");


    document
        .getElementById("adminEmail")
        .innerText = user.email;


    showStatus(
        "Đăng nhập Admin thành công.",
        "success"
    );
}


/* =========================================================
   ĐĂNG XUẤT
========================================================= */

function logout() {

    auth.signOut()
        .then(() => {

            document
                .getElementById("adminCard")
                .classList.add("hidden");

            document
                .getElementById("loginCard")
                .classList.remove("hidden");

            document
                .getElementById("password")
                .value = "";

            showLoginStatus(
                "Đã đăng xuất.",
                "info"
            );

        });

}


/* =========================================================
   KIỂM TRA ID THIẾT BỊ
========================================================= */

function checkDevice() {

    const deviceId =
        document
            .getElementById("deviceId")
            .value
            .trim()
            .toUpperCase();


    if (!deviceId) {

        showStatus(
            "Vui lòng nhập ID thiết bị.",
            "error"
        );

        return;
    }


    showStatus(
        "Đang kiểm tra thiết bị...",
        "info"
    );


    db.collection("licenses")
        .doc(deviceId)
        .get()

        .then((doc) => {

            const box =
                document.getElementById("deviceInfo");

            box.classList.remove("hidden");


            if (!doc.exists) {

                box.innerHTML =
                    "🆕 <strong>ID chưa tồn tại.</strong><br>" +
                    "Bạn có thể tạo license cho ID này.";

                showStatus(
                    "ID chưa tồn tại trong Firebase.",
                    "info"
                );

                return;
            }


            const data = doc.data();


            let html =
                "📱 <strong>ID:</strong> " +
                (data.deviceId || deviceId);


            html +=
                "<br>🔐 <strong>Active:</strong> " +
                (data.active === true
                    ? "ĐANG KÍCH HOẠT"
                    : "CHƯA KÍCH HOẠT");


            if (data.trialStartedAt) {

                html +=
                    "<br>🎁 <strong>Trial bắt đầu:</strong> " +
                    formatTimestamp(
                        data.trialStartedAt
                    );
            }


            if (data.expiresAt) {

                html +=
                    "<br>⏰ <strong>Hết hạn:</strong> " +
                    formatTimestamp(
                        data.expiresAt
                    );

            } else {

                if (data.active === true) {

                    html +=
                        "<br>♾️ <strong>Thời hạn:</strong> Vĩnh viễn";

                }

            }


            box.innerHTML = html;


            showStatus(
                "Đã tìm thấy ID thiết bị.",
                "success"
            );

        })

        .catch((error) => {

            console.error(error);

            showStatus(
                "Không thể đọc dữ liệu: " +
                getFirebaseError(error),
                "error"
            );

        });
}


/* =========================================================
   CHỌN THỜI HẠN
   Bấm các nút chỉ để chọn, không kích hoạt ngay.
========================================================= */

let selectedDuration = null;

function selectDuration(value, unit, label, button) {

    selectedDuration = { value, unit, label };

    document.querySelectorAll(".buttons button").forEach((btn) => {
        btn.classList.remove("selected");
    });

    if (button) button.classList.add("selected");

    document.getElementById("selectedDurationText").innerText = label;
    document.getElementById("activateButton").disabled = false;

    showStatus(
        "Đã chọn thời hạn " + label + ". Bấm KÍCH HOẠT PREMIUM để cấp.",
        "info"
    );
}

function selectCustomDuration() {

    const value = parseInt(document.getElementById("customValue").value, 10);
    const unit = document.getElementById("customUnit").value;

    if (!Number.isInteger(value) || value < 1) {
        showStatus("Vui lòng nhập số lớn hơn hoặc bằng 1.", "error");
        return;
    }

    let label;
    if (unit === "days") label = value + " NGÀY";
    else if (unit === "months") label = value + " THÁNG";
    else label = value + " NĂM";

    selectedDuration = { value, unit, label };

    document.querySelectorAll(".buttons button").forEach((btn) => {
        btn.classList.remove("selected");
    });

    document.getElementById("selectedDurationText").innerText = label;
    document.getElementById("activateButton").disabled = false;

    showStatus(
        "Đã chọn thời hạn " + label + ". Bấm KÍCH HOẠT PREMIUM để cấp.",
        "info"
    );
}

/* =========================================================
   KÍCH HOẠT THỜI HẠN ĐÃ CHỌN
   Không còn hộp thoại confirm của trình duyệt.
========================================================= */

function activateSelected() {

    if (!selectedDuration) {
        showStatus("Vui lòng chọn thời hạn trước.", "error");
        return;
    }

    const deviceId = document.getElementById("deviceId").value.trim().toUpperCase();

    if (!deviceId) {
        showStatus("Vui lòng nhập ID thiết bị trước.", "error");
        return;
    }

    const user = auth.currentUser;

    if (!user) {
        showStatus("Phiên Admin đã hết. Vui lòng đăng nhập lại.", "error");
        return;
    }

    if (!user.email || user.email.toLowerCase() !== "xavantai@gmail.com") {
        showStatus("Tài khoản không có quyền Admin.", "error");
        return;
    }

    const value = selectedDuration.value;
    const unit = selectedDuration.unit;
    const label = selectedDuration.label;

    showStatus("Đang kích hoạt " + label + "...", "info");

    const data = {
        deviceId: deviceId,
        active: true,
        activatedAt: firebase.firestore.FieldValue.serverTimestamp(),
        activatedBy: user.email,
        durationValue: value,
        durationUnit: unit,
        durationText: label
    };

    if (unit === "forever") {
        data.expiresAt = firebase.firestore.FieldValue.delete();
    } else {
        const expireDate = new Date();

        if (unit === "days") {
            expireDate.setDate(expireDate.getDate() + value);
        } else {
            const months = unit === "years" ? value * 12 : value;
            expireDate.setMonth(expireDate.getMonth() + months);
        }

        data.expiresAt = firebase.firestore.Timestamp.fromDate(expireDate);
    }

    db.collection("licenses")
        .doc(deviceId)
        .set(data, { merge: true })
        .then(() => {
            showStatus(
                "✅ KÍCH HOẠT THÀNH CÔNG!\n\n" +
                "ID: " + deviceId + "\n" +
                "Thời hạn: " + label,
                "success"
            );
            checkDevice();
        })
        .catch((error) => {
            console.error(error);
            showStatus(
                "❌ Kích hoạt thất bại:\n" + getFirebaseError(error),
                "error"
            );
        });
}


/* =========================================================
   TEXT THỜI HẠN
========================================================= */

function getDurationText(days) {
    switch(days) {
        case 1: return "1 ngày";
        case 7: return "7 ngày";
        case 30: return "1 tháng";
        case 90: return "3 tháng";
        case 180: return "6 tháng";
        case 365: return "1 năm";
        case 0: return "Vĩnh viễn";
        default: return days + " ngày";
    }
}


/* =========================================================
   FORMAT FIRESTORE TIMESTAMP
========================================================= */

function formatTimestamp(timestamp) {

    if (!timestamp) {
        return "Không có";
    }


    const date =
        timestamp.toDate();


    return date.toLocaleString(
        "vi-VN",
        {
            year: "numeric",
            month: "2-digit",
            day: "2-digit",
            hour: "2-digit",
            minute: "2-digit"
        }
    );
}


/* =========================================================
   FIREBASE ERROR
========================================================= */

function getFirebaseError(error) {

    if (!error) {
        return "Lỗi không xác định.";
    }


    switch(error.code) {

        case "auth/invalid-credential":
            return "Email hoặc mật khẩu không đúng.";

        case "auth/user-not-found":
            return "Không tìm thấy tài khoản.";

        case "auth/wrong-password":
            return "Mật khẩu không đúng.";

        case "auth/too-many-requests":
            return "Có quá nhiều lần thử. Vui lòng thử lại sau.";

        case "permission-denied":
            return "Firebase từ chối quyền truy cập.";

        default:
            return error.message || "Lỗi không xác định.";
    }

}


/* =========================================================
   STATUS
========================================================= */

function showStatus(message, type) {

    const status =
        document.getElementById("status");

    status.innerText = message;

    status.className =
        "status " + (type || "");

}


function showLoginStatus(message, type) {

    const status =
        document.getElementById("loginStatus");

    status.innerText = message;

    status.className =
        "status " + (type || "");

}


/* =========================================================
   KIỂM TRA TRẠNG THÁI ĐĂNG NHẬP
========================================================= */

auth.onAuthStateChanged((user) => {

    if (
        user &&
        user.email &&
        user.email.toLowerCase()
        === "xavantai@gmail.com"
    ) {

        showAdminPanel(user);

    }

});

</script>

</body>
</html>
