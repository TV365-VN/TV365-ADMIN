<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TV365 ADMIN</title>

<style>
*{box-sizing:border-box}
body{
    margin:0;
    font-family:Arial,sans-serif;
    background:#f5f6fa;
    color:#222;
}
.header{
    background:#111827;
    color:#fff;
    padding:18px 25px;
    font-size:22px;
    font-weight:bold;
}
.container{
    max-width:1100px;
    margin:30px auto;
    padding:20px;
}
.card{
    background:#fff;
    border-radius:12px;
    padding:25px;
    box-shadow:0 3px 15px rgba(0,0,0,.08);
    margin-bottom:20px;
}
h2{margin-top:0}
label{
    display:block;
    margin-top:18px;
    margin-bottom:7px;
    font-weight:bold;
}
input,select{
    width:100%;
    padding:13px;
    border:1px solid #ccc;
    border-radius:8px;
    font-size:16px;
}
button{
    padding:12px 18px;
    border:none;
    border-radius:8px;
    background:#2563eb;
    color:#fff;
    font-weight:bold;
    cursor:pointer;
    font-size:15px;
}
button:hover{opacity:.9}
button:disabled{opacity:.5;cursor:not-allowed}
.login-btn{width:100%;margin-top:20px}
.logout{background:#dc2626;float:right}
.hidden{display:none!important}
.status{
    margin-top:20px;
    padding:15px;
    background:#f1f5f9;
    border-radius:8px;
    line-height:1.6;
    white-space:pre-line;
}
.success{background:#dcfce7;color:#166534}
.error{background:#fee2e2;color:#991b1b}
.info{background:#dbeafe;color:#1e40af}
.user-info{
    margin-bottom:20px;
    padding:12px;
    background:#f1f5f9;
    border-radius:8px;
}
.device-info{
    margin-top:20px;
    padding:15px;
    background:#f8fafc;
    border-radius:10px;
    border:1px solid #e2e8f0;
    line-height:1.8;
}
.buttons{
    display:grid;
    grid-template-columns:repeat(4,1fr);
    gap:10px;
    margin-top:20px;
}
.buttons button{background:#2563eb}
.buttons button.selected{
    background:#16a34a!important;
    box-shadow:0 0 0 3px rgba(22,163,74,.2);
}
.activate-panel{
    margin-top:18px;
    padding:16px;
    background:#f8fafc;
    border:1px solid #e2e8f0;
    border-radius:10px;
}
.selected-duration{
    margin-bottom:12px;
    font-size:16px;
    color:#334155;
}
.activate-main{
    width:100%;
    background:#16a34a;
    font-size:16px;
    padding:14px;
}
.custom-duration{
    margin-top:22px;
    padding:18px;
    background:#f8fafc;
    border:1px solid #e2e8f0;
    border-radius:10px;
}
.custom-row{
    display:grid;
    grid-template-columns:1fr 180px;
    gap:10px;
}
.custom-button{
    width:100%;
    margin-top:12px;
    background:#16a34a;
}

/* DASHBOARD */
.platform-title{
    margin:0 0 15px;
    font-size:21px;
}
.platform-title.mobile{color:#2563eb}
.platform-title.tv{color:#7c3aed}
.stats-grid{
    display:grid;
    grid-template-columns:repeat(4,1fr);
    gap:12px;
}
.stat-card{
    border:0;
    border-radius:12px;
    padding:18px;
    text-align:left;
    min-height:115px;
    transition:.15s;
    box-shadow:0 2px 8px rgba(0,0,0,.08);
}
.stat-card:hover{transform:translateY(-2px)}
.stat-card .icon{font-size:25px}
.stat-card .label{
    margin:8px 0 2px;
    font-size:14px;
    font-weight:bold;
}
.stat-card .count{
    font-size:30px;
    font-weight:bold;
}
.stat-trial{background:#fef3c7;color:#92400e}
.stat-trial-expired{background:#fee2e2;color:#991b1b}
.stat-premium-expired{background:#ffedd5;color:#9a3412}
.stat-blocked{background:#e5e7eb;color:#1f2937}

.dashboard-tools{
    display:flex;
    gap:10px;
    align-items:center;
    flex-wrap:wrap;
    margin-bottom:15px;
}
.dashboard-tools button{background:#0f766e}
.dashboard-tools .last-update{
    font-size:13px;
    color:#64748b;
}

.list-panel{
    margin-top:18px;
    border:1px solid #e2e8f0;
    border-radius:10px;
    overflow:hidden;
}
.list-header{
    padding:14px 16px;
    background:#f8fafc;
    font-weight:bold;
}
.device-row{
    padding:14px 16px;
    border-top:1px solid #e2e8f0;
    display:flex;
    justify-content:space-between;
    gap:12px;
    align-items:center;
}
.device-row:hover{background:#f8fafc}
.device-id{
    font-weight:bold;
    word-break:break-all;
}
.device-sub{
    color:#64748b;
    font-size:13px;
    margin-top:4px;
}
.device-actions{
    display:flex;
    gap:8px;
    flex-shrink:0;
}
.btn-detail{background:#2563eb}
.btn-lock{background:#dc2626}
.btn-unlock{background:#16a34a}
.empty{
    padding:25px;
    text-align:center;
    color:#64748b;
}
.search-row{
    display:grid;
    grid-template-columns:1fr auto;
    gap:10px;
    margin-top:15px;
}

/* MODAL */
.modal-backdrop{
    position:fixed;
    inset:0;
    background:rgba(0,0,0,.55);
    display:flex;
    align-items:center;
    justify-content:center;
    padding:20px;
    z-index:9999;
}
.modal{
    width:min(560px,100%);
    max-height:90vh;
    overflow:auto;
    background:#fff;
    border-radius:14px;
    padding:22px;
    box-shadow:0 15px 45px rgba(0,0,0,.25);
}
.modal h3{margin-top:0}
.modal-actions{
    display:flex;
    gap:10px;
    margin-top:20px;
}
.modal-actions button{flex:1}
.btn-close{background:#64748b}
.detail-line{
    padding:8px 0;
    border-bottom:1px solid #e2e8f0;
}
.badge{
    display:inline-block;
    padding:4px 9px;
    border-radius:999px;
    font-size:12px;
    font-weight:bold;
}
.badge-trial{background:#fef3c7;color:#92400e}
.badge-expired{background:#fee2e2;color:#991b1b}
.badge-premium{background:#dcfce7;color:#166534}
.badge-blocked{background:#e5e7eb;color:#1f2937}

@media(max-width:800px){
    .stats-grid{grid-template-columns:repeat(2,1fr)}
}
@media(max-width:700px){
    .container{padding:10px;margin-top:15px}
    .logout{float:none;width:100%;margin-top:15px}
    .buttons{grid-template-columns:repeat(2,1fr)}
    .custom-row{grid-template-columns:1fr}
    .device-row{align-items:flex-start;flex-direction:column}
    .device-actions{width:100%}
    .device-actions button{flex:1}
    .search-row{grid-template-columns:1fr}
}
</style>
</head>

<body>

<div class="header">📺 TV365 ADMIN</div>

<div class="container">

<!-- LOGIN -->
<div class="card" id="loginCard">
    <h2>🔐 Đăng nhập Admin</h2>
    <p>Chỉ tài khoản quản trị TV365 mới được sử dụng hệ thống.</p>

    <label>Email</label>
    <input type="email" id="email" placeholder="Email Admin">

    <label>Mật khẩu</label>
    <input type="password" id="password" placeholder="Mật khẩu">

    <button class="login-btn" onclick="login()" id="loginButton">
        ĐĂNG NHẬP
    </button>

    <div class="status" id="loginStatus">
        Vui lòng đăng nhập.
    </div>
</div>

<!-- ADMIN -->
<div class="card hidden" id="adminCard">

    <button class="logout" onclick="logout()">ĐĂNG XUẤT</button>

    <h2>⚙️ Quản lý Premium & Thiết bị</h2>

    <div class="user-info">
        👤 Admin: <strong id="adminEmail"></strong>
    </div>

    <!-- =====================================================
         DASHBOARD
    ====================================================== -->
    <div class="card" style="padding:18px;background:#fafafa;box-shadow:none;border:1px solid #e2e8f0;">
        <div class="dashboard-tools">
            <button onclick="loadDashboard()">🔄 LÀM MỚI THỐNG KÊ</button>
            <span class="last-update" id="lastUpdate">Chưa tải dữ liệu</span>
        </div>

        <h3 class="platform-title mobile">📱 MOBILE</h3>

        <div class="stats-grid">
            <button class="stat-card stat-trial" onclick="showDeviceList('mobile','trial')">
                <div class="icon">🟡</div>
                <div class="label">ĐANG DÙNG THỬ</div>
                <div class="count" id="mobileTrialCount">0</div>
            </button>

            <button class="stat-card stat-trial-expired" onclick="showDeviceList('mobile','trialExpired')">
                <div class="icon">🔴</div>
                <div class="label">HẾT DÙNG THỬ</div>
                <div class="count" id="mobileTrialExpiredCount">0</div>
            </button>

            <button class="stat-card stat-premium-expired" onclick="showDeviceList('mobile','premiumExpired')">
                <div class="icon">🟠</div>
                <div class="label">PREMIUM HẾT HẠN</div>
                <div class="count" id="mobilePremiumExpiredCount">0</div>
            </button>

            <button class="stat-card stat-blocked" onclick="showDeviceList('mobile','blocked')">
                <div class="icon">🔒</div>
                <div class="label">ĐÃ KHÓA</div>
                <div class="count" id="mobileBlockedCount">0</div>
            </button>
        </div>

        <h3 class="platform-title tv" style="margin-top:28px;">📺 TIVI</h3>

        <div class="stats-grid">
            <button class="stat-card stat-trial" onclick="showDeviceList('tv','trial')">
                <div class="icon">🟡</div>
                <div class="label">ĐANG DÙNG THỬ</div>
                <div class="count" id="tvTrialCount">0</div>
            </button>

            <button class="stat-card stat-trial-expired" onclick="showDeviceList('tv','trialExpired')">
                <div class="icon">🔴</div>
                <div class="label">HẾT DÙNG THỬ</div>
                <div class="count" id="tvTrialExpiredCount">0</div>
            </button>

            <button class="stat-card stat-premium-expired" onclick="showDeviceList('tv','premiumExpired')">
                <div class="icon">🟠</div>
                <div class="label">PREMIUM HẾT HẠN</div>
                <div class="count" id="tvPremiumExpiredCount">0</div>
            </button>

            <button class="stat-card stat-blocked" onclick="showDeviceList('tv','blocked')">
                <div class="icon">🔒</div>
                <div class="label">ĐÃ KHÓA</div>
                <div class="count" id="tvBlockedCount">0</div>
            </button>
        </div>

        <div class="list-panel hidden" id="deviceListPanel">
            <div class="list-header" id="deviceListTitle"></div>

            <div style="padding:12px;">
                <div class="search-row">
                    <input id="listSearch"
                           placeholder="🔍 Tìm ID trong danh sách..."
                           oninput="renderDeviceList()">
                    <button onclick="closeDeviceList()" style="background:#64748b;">
                        ĐÓNG
                    </button>
                </div>
            </div>

            <div id="deviceList"></div>
        </div>
    </div>

    <!-- =====================================================
         KIỂM TRA ID
    ====================================================== -->
    <label>ID thiết bị</label>

    <input
        type="text"
        id="deviceId"

    >

    <button

        onclick="checkDevice()"

        🔍 KIỂM TRA ID
    </button>

    <div class="device-info hidden" id="deviceInfo"></div>

    <!-- =====================================================
         PREMIUM
    ====================================================== -->
    <label>Thời hạn Premium</label>

    <div class="buttons">

        <button type="button"
                data-duration="1"
                onclick="selectDuration(1,'days','1 NGÀY',this)">
            1 NGÀY

        <button type="button"
                data-duration="7"
                onclick="selectDuration(7,'days','7 NGÀY',this)">
            7 NGÀY
        </button>

        <button type="button"
                data-duration="1m"
                onclick="selectDuration(1,'months','1 THÁNG',this)">
            1 THÁNG
        </button>

        <button type="button"
                data-duration="3m"
                onclick="selectDuration(3,'months','3 THÁNG',this)">
            3 THÁNG
        </button>

        <button type="button"
                data-duration="6m"
                onclick="selectDuration(6,'months','6 THÁNG',this)">

        <button type="button"
                data-duration="1y"
                onclick="selectDuration(1,'years','1 NĂM',this)">
            1 NĂM

        <button type="button"
                data-duration="forever"
                onclick="selectDuration(0,'forever','VĨNH VIỄN',this)"
                style="background:#16a34a;">
            ♾️ VĨNH VIỄN
        </button>

    </div>

    <div class="custom-duration">

        <div class="custom-row">
            <input type="number"
                   id="customValue"
                   min="1"
                   step="1"
                   placeholder="Nhập số">

            <select id="customUnit">
                <option value="days">NGÀY</option>
                <option value="months">THÁNG</option>
                <option value="years">NĂM</option>
            </select>
        </div>

        <button type="button"
                class="custom-button"
                onclick="selectCustomDuration()">
            ➕ CHỌN THỜI HẠN TÙY CHỈNH
        </button>
    </div>

    <div class="activate-panel">
        <div class="selected-duration">
            Thời hạn đã chọn:
            <strong id="selectedDurationText">Chưa chọn</strong>

        <button type="button"
                id="activateButton"
                class="activate-main"
                onclick="activateSelected()"
                disabled>
            🔐 KÍCH HOẠT PREMIUM
        </button>
    </div>

    <div class="status" id="status">
        Chưa có thao tác.
    </div>

</div>
</div>

<!-- MODAL CHI TIẾT -->
<div class="modal-backdrop hidden" id="detailModal">
    <div class="modal">
        <h3>📋 Chi tiết thiết bị</h3>
        <div id="detailContent"></div>

        <div class="modal-actions">
            <button class="btn-close" onclick="closeDetailModal()">ĐÓNG</button>
            <button id="detailActionButton" onclick="toggleBlockedFromModal()">
                🔒 KHÓA
            </button>
        </div>
    </div>
</div>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>

<script>
/* =========================================================
   FIREBASE
========================================================= */

const firebaseConfig = {
    apiKey: "AIzaSyAH--nzfxtxwRiPW8RwikcTmdM82pFpGSw",
    authDomain: "tv365-b45e0.firebaseapp.com",
    projectId: "tv365-b45e0",
    storageBucket: "tv365-b45e0.firebasestorage.app",
    messagingSenderId: "157742231327",
    appId: "1:157742231327:web:4e00ccddb6fcde93d94a2a"
};

firebase.initializeApp(firebaseConfig);

const auth = firebase.auth();
const db = firebase.firestore();

const ADMIN_EMAIL = "xavantai@gmail.com";

let selectedDuration = null;
let allLicenses = [];
let currentListPlatform = null;
let currentListType = null;
let currentDetailId = null;

/* =========================================================
   LOGIN
========================================================= */

function login(){

    const email =
        document.getElementById("email").value.trim();

    const password =
        document.getElementById("password").value;

    if(!email || !password){
        showLoginStatus(
            "Vui lòng nhập email và mật khẩu.",
            "error"
        );
        return;
    }

    const button =
        document.getElementById("loginButton");

    button.disabled = true;
    button.innerText = "ĐANG ĐĂNG NHẬP...";

    auth.signInWithEmailAndPassword(email,password)
        .then(result => {

            const user = result.user;

            if(!user.email ||
               user.email.toLowerCase() !== ADMIN_EMAIL){

                return auth.signOut().then(() => {
                    throw new Error(
                        "Tài khoản này không có quyền Admin."
                    );
                });
            }

            showAdminPanel(user);
        })
        .catch(error => {

            console.error(error);

            showLoginStatus(
                "Đăng nhập thất bại: " +
                getFirebaseError(error),
                "error"
            );
        })
        .finally(() => {

            button.disabled = false;
            button.innerText = "ĐĂNG NHẬP";
        });
}

function showAdminPanel(user){

    document
        .getElementById("loginCard")
        .classList.add("hidden");

    document
        .getElementById("adminCard")
        .classList.remove("hidden");

    document
        .getElementById("adminEmail")
        .innerText = user.email;

    showStatus(
        "Đăng nhập Admin thành công.",
        "success"
    );

    loadDashboard();
}

function logout(){

    auth.signOut().then(() => {

        document
            .getElementById("adminCard")
            .classList.add("hidden");

        document
            .getElementById("loginCard")
            .classList.remove("hidden");

        document
            .getElementById("password")
            .value = "";

        allLicenses = [];

        closeDeviceList();

        showLoginStatus(
            "Đã đăng xuất.",
            "info"
        );
    });
}

/* =========================================================
   DASHBOARD
========================================================= */

function getPlatform(deviceId){

    const id = String(deviceId || "").toUpperCase();

    if(id.startsWith("TV365-DT-")) return "mobile";
    if(id.startsWith("TV365-TV-")) return "tv";

    return null;
}

function getTrialDaysFromConfig(){

    return db.collection("premium_config")
        .doc("system")
        .get()
        .then(doc => {

            if(!doc.exists) return 30;

            const value = doc.data().trialDays;

            return Number.isFinite(Number(value))
                ? Number(value)
                : 30;
        });
}

function timestampToMillis(value){

    if(!value) return null;

    if(typeof value.toMillis === "function"){
        return value.toMillis();
    }

    if(typeof value.toDate === "function"){
        return value.toDate().getTime();
    }

    return null;
}

function classifyLicense(data, trialDays){

    const now = Date.now();

    if(data.blocked === true){
        return "blocked";
    }

    if(data.active === true){

        const expires =
            timestampToMillis(data.expiresAt);

        if(expires === null){
            return "premiumActive";
        }

        if(now < expires){
            return "premiumActive";
        }

        return "premiumExpired";
    }

    const trialStart =
        timestampToMillis(data.trialStartedAt);

    if(trialStart !== null){

        const trialExpire =
            trialStart +
            trialDays * 24 * 60 * 60 * 1000;

        if(now < trialExpire){
            return "trial";
        }

        return "trialExpired";
    }

    return "trialExpired";
}

async function loadDashboard(){

    try{

        document.getElementById("lastUpdate").innerText =
            "Đang tải dữ liệu...";

        const [snapshot, trialDays] =
            await Promise.all([
                db.collection("licenses").get(),
                getTrialDaysFromConfig()
            ]);

        allLicenses = [];

        snapshot.forEach(doc => {

            const data = doc.data() || {};

            const deviceId =
                String(
                    data.deviceId || doc.id
                ).toUpperCase();

            const platform =
                getPlatform(deviceId);

            if(!platform) return;

            allLicenses.push({
                id: deviceId,
                data: data,
                platform: platform,
                category: classifyLicense(
                    data,
                    trialDays
                )
            });
        });

        updateCounts();

        document.getElementById("lastUpdate").innerText =
            "Cập nhật: " +
            new Date().toLocaleString("vi-VN");

    }catch(error){

        console.error(error);

        document.getElementById("lastUpdate").innerText =
            "Không tải được dữ liệu.";

        showStatus(
            "Không thể tải danh sách thiết bị:\n" +
            getFirebaseError(error),
            "error"
        );
    }
}

function updateCounts(){

    const count = (platform,category) =>
        allLicenses.filter(x =>
            x.platform === platform &&
            x.category === category
        ).length;

    document.getElementById("mobileTrialCount").innerText =
        count("mobile","trial");

    document.getElementById("mobileTrialExpiredCount").innerText =
        count("mobile","trialExpired");

    document.getElementById("mobilePremiumExpiredCount").innerText =
        count("mobile","premiumExpired");

    document.getElementById("mobileBlockedCount").innerText =
        count("mobile","blocked");

    document.getElementById("tvTrialCount").innerText =
        count("tv","trial");

    document.getElementById("tvTrialExpiredCount").innerText =
        count("tv","trialExpired");

    document.getElementById("tvPremiumExpiredCount").innerText =
        count("tv","premiumExpired");

    document.getElementById("tvBlockedCount").innerText =
        count("tv","blocked");
}

/* =========================================================
   DANH SÁCH ID
========================================================= */

const categoryNames = {
    trial: "🟡 ĐANG DÙNG THỬ",
    trialExpired: "🔴 HẾT DÙNG THỬ",
    premiumExpired: "🟠 PREMIUM HẾT HẠN",
    blocked: "🔒 ĐÃ KHÓA"
};

function showDeviceList(platform,type){

    currentListPlatform = platform;
    currentListType = type;

    document
        .getElementById("deviceListPanel")
        .classList.remove("hidden");

    document.getElementById("listSearch").value = "";

    const platformName =
        platform === "mobile"
            ? "📱 MOBILE"
            : "📺 TIVI";

    document.getElementById("deviceListTitle").innerText =
        platformName + " — " +
        categoryNames[type];

    renderDeviceList();

    document
        .getElementById("deviceListPanel")
        .scrollIntoView({
            behavior:"smooth",
            block:"start"
        });
}

function renderDeviceList(){

    const search =
        document
            .getElementById("listSearch")
            .value
            .trim()
            .toUpperCase();

    const list =
        allLicenses
            .filter(item =>
                item.platform === currentListPlatform &&
                item.category === currentListType
            )
            .filter(item =>
                !search ||
                item.id.includes(search)
            )
            .sort((a,b) =>
                a.id.localeCompare(b.id)
            );

    const box =
        document.getElementById("deviceList");

    if(list.length === 0){

        box.innerHTML =
            '<div class="empty">Không có thiết bị trong nhóm này.</div>';

        return;
    }

    box.innerHTML =
        list.map(item => {

            const blocked =
                item.data.blocked === true;

            let sub = "";

            if(item.category === "trial"){
                sub = "🎁 Đang dùng thử";
            }else if(item.category === "trialExpired"){
                sub = "🔴 Đã hết thời gian dùng thử";
            }else if(item.category === "premiumExpired"){
                sub = "🟠 Premium đã hết hạn";
            }else if(item.category === "blocked"){
                sub = "🔒 " +
                    (item.data.blockReason ||
                     "Thiết bị bị khóa");
            }

            return `
                <div class="device-row">
                    <div>
                        <div class="device-id">${escapeHtml(item.id)}</div>
                        <div class="device-sub">${escapeHtml(sub)}</div>
                    </div>

                    <div class="device-actions">
                        <button
                            class="btn-detail"
                            onclick="openDetail('${escapeJs(item.id)}')">
                            👁️ CHI TIẾT
                        </button>

                        ${
                            blocked
                            ? `
                            <button
                                class="btn-unlock"
                                onclick="toggleBlocked('${escapeJs(item.id)}',false)">
                                🔓 MỞ KHÓA
                            </button>
                            `
                            : `
                            <button
                                class="btn-lock"
                                onclick="toggleBlocked('${escapeJs(item.id)}',true)">
                                🔒 KHÓA
                            </button>
                            `
                        }
                    </div>
                </div>
            `;
        }).join("");
}

function closeDeviceList(){

    document
        .getElementById("deviceListPanel")
        .classList.add("hidden");

    currentListPlatform = null;
    currentListType = null;
}

/* =========================================================
   CHI TIẾT
========================================================= */

function openDetail(deviceId){

    const item =
        allLicenses.find(x => x.id === deviceId);

    if(!item){
        showStatus(
            "Không tìm thấy thiết bị.",
            "error"
        );
        return;
    }

    currentDetailId = deviceId;

    const data = item.data;
    const blocked = data.blocked === true;

    let statusHtml = "";

    switch(item.category){

        case "blocked":
            statusHtml =
                '<span class="badge badge-blocked">🔒 ĐÃ KHÓA</span>';
            break;

        case "trial":
            statusHtml =
                '<span class="badge badge-trial">🟡 ĐANG DÙNG THỬ</span>';
            break;

        case "trialExpired":
            statusHtml =
                '<span class="badge badge-expired">🔴 HẾT DÙNG THỬ</span>';
            break;

        case "premiumExpired":
            statusHtml =
                '<span class="badge badge-expired">🟠 PREMIUM HẾT HẠN</span>';
            break;

        default:
            statusHtml =
                '<span class="badge badge-premium">🟢 PREMIUM ĐANG HOẠT ĐỘNG</span>';
    }

    let html = "";

    html +=
        '<div class="detail-line"><strong>ID:</strong> ' +
        escapeHtml(deviceId) +
        '</div>';

    html +=
        '<div class="detail-line"><strong>Thiết bị:</strong> ' +
        (
            item.platform === "mobile"
            ? "📱 Mobile"
            : "📺 Tivi"
        ) +
        '</div>';

    html +=
        '<div class="detail-line"><strong>Trạng thái:</strong> ' +
        statusHtml +
        '</div>';

    if(data.trialStartedAt){

        html +=
            '<div class="detail-line"><strong>Trial bắt đầu:</strong> ' +
            formatTimestamp(data.trialStartedAt) +
            '</div>';
    }

    if(data.active === true){

        html +=
            '<div class="detail-line"><strong>Premium:</strong> ĐANG KÍCH HOẠT</div>';

        if(data.durationText){

            html +=
                '<div class="detail-line"><strong>Gói:</strong> ' +
                escapeHtml(data.durationText) +
                '</div>';
        }

        if(data.expiresAt){

            html +=
                '<div class="detail-line"><strong>Premium hết hạn:</strong> ' +
                formatTimestamp(data.expiresAt) +
                '</div>';

        }else{

            html +=
                '<div class="detail-line"><strong>Thời hạn:</strong> ♾️ Vĩnh viễn</div>';
        }
    }else{

        html +=
            '<div class="detail-line"><strong>Premium:</strong> Chưa kích hoạt</div>';
    }

    if(blocked){

        html +=
            '<div class="detail-line"><strong>Lý do khóa:</strong> ' +
            escapeHtml(
                data.blockReason ||
                "Sử dụng gian lận"
            ) +
            '</div>';

        if(data.blockedAt){

            html +=
                '<div class="detail-line"><strong>Thời gian khóa:</strong> ' +
                formatTimestamp(data.blockedAt) +
                '</div>';
        }

        if(data.blockedBy){

            html +=
                '<div class="detail-line"><strong>Khóa bởi:</strong> ' +
                escapeHtml(data.blockedBy) +
                '</div>';
        }
    }

    document.getElementById("detailContent").innerHTML = html;

    const action =
        document.getElementById("detailActionButton");

    action.innerText =
        blocked
            ? "🔓 MỞ KHÓA"
            : "🔒 KHÓA THIẾT BỊ";

    action.className =
        blocked
            ? "btn-unlock"
            : "btn-lock";

    document
        .getElementById("detailModal")
        .classList.remove("hidden");
}

function closeDetailModal(){

    document
        .getElementById("detailModal")
        .classList.add("hidden");

    currentDetailId = null;
}

function toggleBlockedFromModal(){

    if(!currentDetailId) return;

    const item =
        allLicenses.find(x =>
            x.id === currentDetailId
        );

    if(!item) return;

    toggleBlocked(
        currentDetailId,
        item.data.blocked !== true
    );
}

/* =========================================================
   KHÓA / MỞ KHÓA
   GHI TRỰC TIẾP VÀO FIRESTORE
========================================================= */

async function toggleBlocked(deviceId, shouldBlock){

    const user = auth.currentUser;

    if(!user ||
       !user.email ||
       user.email.toLowerCase() !== ADMIN_EMAIL){

        showStatus(
            "Tài khoản không có quyền Admin.",
            "error"
        );
        return;
    }

    const ref =
        db.collection("licenses")
          .doc(deviceId);

    try{

        if(shouldBlock){

            const reason =
                prompt(
                    "Nhập lý do khóa thiết bị:",
                    "Sử dụng gian lận"
                );

            if(reason === null) return;

            const finalReason =
                reason.trim() ||
                "Sử dụng gian lận";

            await ref.set({

                blocked: true,

                blockReason: finalReason,

                blockedAt:
                    firebase.firestore.FieldValue.serverTimestamp(),

                blockedBy:
                    user.email

            },{merge:true});

            showStatus(
                "🔒 Đã khóa thiết bị:\n" +
                deviceId,
                "success"
            );

        }else{

            await ref.set({

                blocked: false,

                blockReason:
                    firebase.firestore.FieldValue.delete(),

                blockedAt:
                    firebase.firestore.FieldValue.delete(),

                blockedBy:
                    firebase.firestore.FieldValue.delete()

            },{merge:true});

            showStatus(
                "🔓 Đã mở khóa thiết bị:\n" +
                deviceId,
                "success"
            );
        }

        closeDetailModal();

        await loadDashboard();

        if(currentListPlatform && currentListType){

            showDeviceList(
                currentListPlatform,
                currentListType
            );
        }

    }catch(error){

        console.error(error);

        showStatus(
            "Không thể cập nhật trạng thái khóa:\n" +
            getFirebaseError(error),
            "error"
        );
    }
}

/* =========================================================
   KIỂM TRA ID
========================================================= */

function checkDevice(){

    const deviceId =
        document
            .getElementById("deviceId")
            .value
            .trim()
            .toUpperCase();

    if(!deviceId){

        showStatus(
            "Vui lòng nhập ID thiết bị.",
            "error"
        );

        return;
    }

    showStatus(
        "Đang kiểm tra thiết bị...",
        "info"
    );

    db.collection("licenses")
        .doc(deviceId)
        .get()
        .then(doc => {

            const box =
                document.getElementById("deviceInfo");

            box.classList.remove("hidden");

            if(!doc.exists){

                box.innerHTML =
                    "🆕 <strong>ID chưa tồn tại.</strong><br>" +
                    "Bạn có thể tạo license cho ID này.";

                showStatus(
                    "ID chưa tồn tại trong Firebase.",
                    "info"
                );

                return;
            }

            const data = doc.data();

            let html =
                "📱 <strong>ID:</strong> " +
                escapeHtml(
                    data.deviceId || deviceId
                );

            html +=
                "<br>🔐 <strong>Active:</strong> " +
                (
                    data.active === true
                    ? "ĐANG KÍCH HOẠT"
                    : "CHƯA KÍCH HOẠT"
                );

            html +=
                "<br>🔒 <strong>Khóa:</strong> " +
                (
                    data.blocked === true
                    ? "ĐÃ KHÓA"
                    : "KHÔNG"
                );

            if(data.blockReason){

                html +=
                    "<br>⚠️ <strong>Lý do:</strong> " +
                    escapeHtml(data.blockReason);
            }

            if(data.trialStartedAt){

                html +=
                    "<br>🎁 <strong>Trial bắt đầu:</strong> " +
                    formatTimestamp(data.trialStartedAt);
            }

            if(data.expiresAt){

                html +=
                    "<br>⏰ <strong>Premium hết hạn:</strong> " +
                    formatTimestamp(data.expiresAt);

            }else if(data.active === true){

                html +=
                    "<br>♾️ <strong>Thời hạn:</strong> Vĩnh viễn";
            }

            html +=
                '<br><br>' +
                '<button type="button" ' +
                'onclick="openDetail(\'' +
                escapeJs(deviceId) +
                '\')" ' +
                'style="background:#2563eb;">' +
                '👁️ XEM CHI TIẾT / KHÓA' +
                '</button>';

            box.innerHTML = html;

            showStatus(
                "Đã tìm thấy ID thiết bị.",
                "success"
            );

        })
        .catch(error => {

            console.error(error);

            showStatus(
                "Không thể đọc dữ liệu: " +
                getFirebaseError(error),
                "error"
            );
        });
}

/* =========================================================
   CHỌN PREMIUM
========================================================= */

function selectDuration(value,unit,label,button){

    selectedDuration = {
        value,
        unit,
        label
    };

    document
        .querySelectorAll(".buttons button")
        .forEach(btn =>
            btn.classList.remove("selected")
        );

    if(button){
        button.classList.add("selected");
    }

    document
        .getElementById("selectedDurationText")
        .innerText = label;

    document
        .getElementById("activateButton")
        .disabled = false;

    showStatus(
        "Đã chọn thời hạn " +
        label +
        ". Bấm KÍCH HOẠT PREMIUM để cấp.",
        "info"
    );
}

function selectCustomDuration(){

    const value =
        parseInt(
            document
                .getElementById("customValue")
                .value,
            10
        );

    const unit =
        document
            .getElementById("customUnit")
            .value;

    if(!Number.isInteger(value) || value < 1){

        showStatus(
            "Vui lòng nhập số lớn hơn hoặc bằng 1.",
            "error"
        );

        return;
    }

    let label;

    if(unit === "days"){
        label = value + " NGÀY";
    }else if(unit === "months"){
        label = value + " THÁNG";
    }else{
        label = value + " NĂM";
    }

    selectedDuration = {
        value,
        unit,
        label
    };

    document
        .querySelectorAll(".buttons button")
        .forEach(btn =>
            btn.classList.remove("selected")
        );

    document
        .getElementById("selectedDurationText")
        .innerText = label;

    document
        .getElementById("activateButton")
        .disabled = false;

    showStatus(
        "Đã chọn thời hạn " +
        label +
        ". Bấm KÍCH HOẠT PREMIUM để cấp.",
        "info"
    );
}

/* =========================================================
   KÍCH HOẠT PREMIUM
========================================================= */

function activateSelected(){

    if(!selectedDuration){

        showStatus(
            "Vui lòng chọn thời hạn trước.",
            "error"
        );

        return;
    }

    const deviceId =
        document
            .getElementById("deviceId")
            .value
            .trim()
            .toUpperCase();

    if(!deviceId){

        showStatus(
            "Vui lòng nhập ID thiết bị trước.",
            "error"
        );

        return;
    }

    const user = auth.currentUser;

    if(!user){

        showStatus(
            "Phiên Admin đã hết. Vui lòng đăng nhập lại.",
            "error"
        );

        return;
    }

    if(!user.email ||
       user.email.toLowerCase() !== ADMIN_EMAIL){

        showStatus(
            "Tài khoản không có quyền Admin.",
            "error"
        );

        return;
    }

    const value =
        selectedDuration.value;

    const unit =
        selectedDuration.unit;

    const label =
        selectedDuration.label;

    showStatus(
        "Đang kích hoạt " +
        label +
        "...",
        "info"
    );

    const data = {

        deviceId: deviceId,

        active: true,

        activatedAt:
            firebase.firestore.FieldValue.serverTimestamp(),

        activatedBy:
            user.email,

        durationValue: value,

        durationUnit: unit,

        durationText: label
    };

    if(unit === "forever"){

        data.expiresAt =
            firebase.firestore.FieldValue.delete();

    }else{

        const expireDate =
            new Date();

        if(unit === "days"){

            expireDate.setDate(
                expireDate.getDate() + value
            );

        }else{

            const months =
                unit === "years"
                    ? value * 12
                    : value;

            expireDate.setMonth(
                expireDate.getMonth() + months
            );
        }

        data.expiresAt =
            firebase.firestore.Timestamp.fromDate(
                expireDate
            );
    }

    db.collection("licenses")
        .doc(deviceId)
        .set(data,{merge:true})
        .then(() => {

            showStatus(
                "✅ KÍCH HOẠT THÀNH CÔNG!\n\n" +
                "ID: " + deviceId + "\n" +
                "Thời hạn: " + label,
                "success"
            );

            checkDevice();
            loadDashboard();

        })
        .catch(error => {

            console.error(error);

            showStatus(
                "❌ Kích hoạt thất bại:\n" +
                getFirebaseError(error),
                "error"
            );
        });
}

/* =========================================================
   FORMAT
========================================================= */

function formatTimestamp(timestamp){

    if(!timestamp){
        return "Không có";
    }

    try{

        const date =
            typeof timestamp.toDate === "function"
                ? timestamp.toDate()
                : new Date(timestamp);

        return date.toLocaleString(
            "vi-VN",
            {
                year:"numeric",
                month:"2-digit",
                day:"2-digit",
                hour:"2-digit",
                minute:"2-digit"
            }
        );

    }catch(e){

        return "Không xác định";
    }
}

/* =========================================================
   SECURITY / HTML
========================================================= */

function escapeHtml(value){

    return String(value ?? "")
        .replace(/&/g,"&amp;")
        .replace(/</g,"&lt;")
        .replace(/>/g,"&gt;")
        .replace(/"/g,"&quot;")
        .replace(/'/g,"&#039;");
}

function escapeJs(value){

    return String(value ?? "")
        .replace(/\\/g,"\\\\")
        .replace(/'/g,"\\'")
        .replace(/\r/g,"\\r")
        .replace(/\n/g,"\\n");
}

/* =========================================================
   ERROR
========================================================= */

function getFirebaseError(error){

    if(!error){
        return "Lỗi không xác định.";
    }

    switch(error.code){

        case "auth/invalid-credential":
            return "Email hoặc mật khẩu không đúng.";

        case "auth/user-not-found":
            return "Không tìm thấy tài khoản.";

        case "auth/wrong-password":
            return "Mật khẩu không đúng.";

        case "auth/too-many-requests":
            return "Có quá nhiều lần thử. Vui lòng thử lại sau.";

        case "permission-denied":
        case "PERMISSION_DENIED":
            return "Firebase từ chối quyền truy cập. Kiểm tra Firestore Rules.";

        default:
            return error.message ||
                "Lỗi không xác định.";
    }
}

/* =========================================================
   STATUS
========================================================= */

function showStatus(message,type){

    const status =
        document.getElementById("status");

    status.innerText =
        message;

    status.className =
        "status " +
        (type || "");
}

function showLoginStatus(message,type){

    const status =
        document.getElementById("loginStatus");

    status.innerText =
        message;

    status.className =
        "status " +
        (type || "");
}

========================================================= */

       user.email &&
       user.email.toLowerCase() === ADMIN_EMAIL){

    }else{

        document
            .getElementById("adminCard")
            .classList.add("hidden");

        document
            .getElementById("loginCard")
            .classList.remove("hidden");

});
